---
# CI-safe TrendRadar configuration for source-health/control-plane
# validation. No secrets, no AI calls, no notifications, no remote
# storage, no production deploy.

app:
  timezone: "UTC"
  show_version_update: false

schedule:
  enabled: false
  preset: "custom"

platforms:
  enabled: false
  sources: []

rss:
  enabled: false
  freshness_filter:
    enabled: false
    max_age_days: 0
  feeds: []

report:
  mode: "current"
  display_mode: "keyword"
  sort_by_position_first: false
  rank_threshold: 10
  max_news_per_keyword: 0

filter:
  method: "keyword"
  priority_sort_enabled: false

ai_filter:
  batch_size: 1
  batch_interval: 0
  min_score: 0
  reclassify_threshold: 1.0
  prompt_file: "prompt.txt"
  extract_prompt_file: "extract_prompt.txt"
  update_tags_prompt_file: "update_tags_prompt.txt"

display:
  region_order:
    - hotlist
  regions:
    hotlist: true
    new_items: false
    rss: false
    standalone: false
    ai_analysis: false
  standalone:
    platforms: []
    rss_feeds: []
    max_items: 0

notification:
  enabled: false
  channels:
    feishu:
      webhook_url: ""
    dingtalk:
      webhook_url: ""
    wework:
      webhook_url: ""
      msg_type: "markdown"
    telegram:
      bot_token: ""
      chat_id: ""
    email:
      from: ""
      password: ""
      to: ""
      smtp_server: ""
      smtp_port: ""
    ntfy:
      server_url: ""
      topic: ""
      token: ""
    bark:
      url: ""
    slack:
      webhook_url: ""
    generic_webhook:
      webhook_url: ""
      payload_template: ""

storage:
  backend: "local"
  formats:
    sqlite: true
    txt: false
    html: false
  local:
    data_dir: "/tmp/trendradar-ci-output"
    retention_days: 1
  remote:
    retention_days: 0
    endpoint_url: ""
    bucket_name: ""
    access_key_id: ""
    secret_access_key: ""
    region: ""
  pull:
    enabled: false
    days: 0

ai:
  model: ""
  api_key: ""
  api_base: ""
  timeout: 1
  temperature: 1.0
  max_tokens: 0
  num_retries: 0
  fallback_models: []

ai_analysis:
  enabled: false
  language: "Chinese"
  prompt_file: "ai_analysis_prompt.txt"
  mode: "current"
  max_news_for_analysis: 0
  include_rss: false
  include_standalone: false
  include_rank_timeline: false

ai_translation:
  enabled: false
  language: "Chinese"
  prompt_file: "ai_translation_prompt.txt"
  scope:
    hotlist: false
    rss: false
    standalone: false

advanced:
  debug: false
  version_check_url: ""
  mcp_version_check_url: ""
  configs_version_check_url: ""
  crawler:
    request_interval: 0
    use_proxy: false
    default_proxy: ""
  rss:
    request_interval: 0
    timeout: 1
    use_proxy: false
    proxy_url: ""
  weight:
    rank: 0.6
    frequency: 0.3
    hotness: 0.1
  max_accounts_per_channel: 1
  batch_size:
    default: 4000
    dingtalk: 20000
    feishu: 30000
    bark: 4000
    slack: 4000
  batch_send_interval: 0
  feishu_message_separator: "---"
